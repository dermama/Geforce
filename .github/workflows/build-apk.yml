name: Build APK

on:
  push:
    branches: [ main, Android ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./opennow-stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: npm install
        working-directory: ./opennow-stable

      - name: Create Capacitor stub directories
        run: |
          mkdir -p android/app/src/main/assets/public
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          mkdir -p android/capacitor-cordova-android-plugins/src/main
          echo 'ext { cdvMinSdkVersion = 24 }' > android/capacitor-cordova-android-plugins/cordova.variables.gradle
          printf 'apply plugin: "com.android.library"\nandroid {\n    namespace "capacitor.cordova.android.plugins"\n    compileSdk = 36\n    defaultConfig {\n        minSdk = 24\n        targetSdk = 36\n    }\n}\n' > android/capacitor-cordova-android-plugins/build.gradle
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android" />\n' > android/capacitor-cordova-android-plugins/src/main/AndroidManifest.xml
          touch android/capacitor-cordova-android-plugins/proguard-rules.pro
        working-directory: ./opennow-stable

      - name: Build Android APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        working-directory: ./opennow-stable

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennow-debug-apk
          path: opennow-stable/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
